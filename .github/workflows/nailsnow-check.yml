
name: NailsNow Code Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    name: Check TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

  backend-check:
    name: Check Supabase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check booking payment
        run: deno check --no-config supabase/functions/create-booking-payment/index.ts

      - name: Check Stripe webhook
        run: deno check --no-config supabase/functions/stripe-payment-webhook/index.ts

      - name: Check booking cancellation
        run: deno check --no-config supabase/functions/cancel-booking-payment/index.ts
